<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EAWRC Scorecard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <section id="profile" class="section">
      <div class="pill-row">
        <div class="profile-input">
          <input type="text" id="profile-name" placeholder="Enter name...">
        </div>
        <div class="stat-pill" data-stat="sp">
          <span class="pill-label">SP</span>
          <span class="pill-value"></span>
        </div>
        <div class="stat-pill" data-stat="tp">
          <span class="pill-label">TP</span>
          <span class="pill-value"></span>
        </div>
      </div>
    </section>

    <section id="totals" class="section">
      <div class="pill-row">
        <div class="stat-pill" data-stat="percentile">
          <span class="pill-label">Percentile</span>
          <span class="pill-value"></span>
        </div>
        <div class="stat-pill" data-stat="delta">
          <span class="pill-label">Delta</span>
          <span class="pill-value"></span>
        </div>
        <div class="stat-pill" data-stat="placement">
          <span class="pill-label">Placement</span>
          <span class="pill-value"></span>
        </div>
        <div class="stat-pill" data-stat="medals">
          <span class="pill-label">Medals</span>
          <span class="pill-value medal-icons">
            <span class="medal-icon" data-stat="medal-WR">
              <span class="medal-dot platinum"></span>
              <span class="medal-count">0</span>
            </span>
            <span class="medal-icon" data-stat="medal-#2">
              <span class="medal-dot gold"></span>
              <span class="medal-count">0</span>
            </span>
            <span class="medal-icon" data-stat="medal-#3">
              <span class="medal-dot silver"></span>
              <span class="medal-count">0</span>
            </span>
            <span class="medal-icon" data-stat="medal-Top 10">
              <span class="medal-dot bronze"></span>
              <span class="medal-count">0</span>
            </span>
          </span>
        </div>
      </div>
    </section>

    <div class="table-wrapper"></div>
  </div>
  <script src="luts.js"></script>
  <script src="calc.js"></script>
  <script src="stats.js"></script>
  <script src="table.js"></script>
  <script src="app.js"></script>
</body>
</html>
