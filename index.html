<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EAWRC Scorecard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="card-header flexwrap">
      <input type="text" id="profile-name" class="profile-input" placeholder="Enter name...">
      <div class="header-stats">
        <div class="stat-pill" data-stat="sp">
          <span class="pill-label">SP</span>
          <span class="pill-value"></span>
        </div>
        <div class="stat-pill" data-stat="tp">
          <span class="pill-label">TP</span>
          <span class="pill-value"></span>
        </div>
      </div>
    </div>

    <div class="card-body">
      <div class="matrix">
        <div class="panel flexwrap totals-bar">
            <div class="stat-pill" data-stat="percentile">
              <span class="pill-label">Percentile</span>
              <span class="pill-value"></span>
            </div>
            <div class="stat-pill" data-stat="delta">
              <span class="pill-label">Delta</span>
              <span class="pill-value"></span>
            </div>
            <div class="stat-pill" data-stat="placement">
              <span class="pill-label">Placement</span>
              <span class="pill-value"></span>
            </div>
            <div class="stat-pill" data-stat="medals">
              <span class="pill-label">Medals</span>
              <span class="pill-value">
                <span class="medal-icon" data-stat="medal1">
                  <span class="medal-dot platinum"></span>
                  <span class="medal-count">0</span>
                </span>
                <span class="medal-icon" data-stat="medal2">
                  <span class="medal-dot gold"></span>
                  <span class="medal-count">0</span>
                </span>
                <span class="medal-icon" data-stat="medal3">
                  <span class="medal-dot silver"></span>
                  <span class="medal-count">0</span>
                </span>
                <span class="medal-icon" data-stat="medal10">
                  <span class="medal-dot bronze"></span>
                  <span class="medal-count">0</span>
                </span>
              </span>
            </div>
        </div>

        <div class="table-wrapper"></div>
      </div>

      <table class="entries-table panel">
          <thead></thead>
          <tbody></tbody>
        </table>
    </div>
  </div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
